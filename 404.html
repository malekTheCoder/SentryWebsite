<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Sentry</title>
<meta name="robots" content="noindex">
<script>(function(){try{var m=localStorage.getItem('sentry-theme');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m);}catch(e){}})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0D0F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F0A961'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0B0D0F; --fg:#E6EAED; --body:#9AA2A8; --dim:#8A939B;
  --line-2:#2A3036; --accent:oklch(0.80 0.15 70); --grid:#12161A;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#FAF8F4; --fg:#12110F; --body:#55514A; --dim:#6B6862;
  --line-2:#C9C4BA; --accent:oklch(0.56 0.17 45); --grid:#F0ECE3;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#FAF8F4; --fg:#12110F; --body:#55514A; --dim:#6B6862;
    --line-2:#C9C4BA; --accent:oklch(0.56 0.17 45); --grid:#F0ECE3;
  }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; padding:32px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:64px 64px;
}
main{max-width:52ch}
.brand{display:flex; align-items:center; gap:12px; margin-bottom:38px}
.dot{width:7px; height:7px; background:var(--accent); border-radius:50%; flex:none}
.name{font-size:13px; font-weight:600; letter-spacing:0.26em; text-transform:uppercase}
.code{font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--dim); margin:0}
h1{
  font-family:Newsreader,Georgia,serif; font-weight:300; letter-spacing:-0.02em;
  font-size:clamp(38px,7vw,72px); line-height:1.0; margin:16px 0 18px; text-wrap:balance;
}
h1 em{font-style:italic; color:var(--accent)}
p{color:var(--body); margin:0 0 28px; text-wrap:pretty}
a{color:var(--fg); text-decoration:none}
a:hover{color:var(--accent)}
.back{
  display:inline-block; font-size:13px; letter-spacing:0.06em; padding:12px 20px;
  border:1px solid var(--accent); color:var(--accent); transition:background .2s,color .2s;
}
.back:hover{background:var(--accent); color:var(--bg)}
</style>
</head>
<body>
<main>
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <span class="name">Sentry</span>
  </div>
  <p class="code">error 404</p>
  <h1>That page isn't <em>here.</em></h1>
  <p>Nothing at this address. The monitor is fine — this is just the website.</p>
  <a class="back" href="/SentryWebsite/">back to the start →</a>
</main>
</body>
</html>
